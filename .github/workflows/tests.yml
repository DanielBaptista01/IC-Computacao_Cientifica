name: scientific-tests

permissions:
  contents: write

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run scientific tests
        run: pytest
      - name: Run inter-depth experiment
        run: ic-interdepth-experiment --output-dir ci-results
      - name: Upload inter-depth results
        uses: actions/upload-artifact@v4
        with:
          name: interdepth-latent-results
          path: ci-results/
      - name: Generate scaled causal dataset
        run: ic-scaled-dataset --config experiments/configs/fase2_dataset_001.json --output-dir ci-dataset
      - name: Upload scaled causal dataset
        uses: actions/upload-artifact@v4
        with:
          name: fase2-dataset-001
          path: ci-dataset/
      - name: Generate final IC dataset and evidence
        run: ic-finalize --config experiments/configs/ic_causal_agents_final_v1.json --output-dir results/final
      - name: Generate physical-source causal dataset v2
        run: ic-physical-v2 --config experiments/configs/ic_causal_agents_physical_v2.json --output-dir results/physical_v2
      - name: Report physical-source v2 summary
        run: |
          echo "=== PHYSICAL V2 SUMMARY ==="
          cat results/physical_v2/PHYSICAL_V2_SUMMARY.json
          echo "=== STATE-RESPONSE IDENTIFIABILITY ==="
          cat results/physical_v2/tables/physical_pair_summary.csv
          echo "=== PROCESS-RESPONSE IDENTIFIABILITY ==="
          cat results/physical_v2/tables/process_pair_summary.csv
          echo "=== MATCHED EM / THERMAL DEPHASING ==="
          cat results/physical_v2/tables/matched_em_thermal_dephasing_summary.csv
          echo "=== THERMAL CHARACTERISTIC TIMES ==="
          cat results/physical_v2/tables/thermal_characteristic_times.csv
          echo "=== DEPHASING SHAPE SUMMARY ==="
          cat results/physical_v2/tables/dephasing_source_shape_summary.csv
          echo "=== EQUAL-RATIO MECHANICAL FREQUENCY TEST ==="
          cat results/physical_v2/tables/mechanical_equal_ratio_frequency_summary.csv
          echo "=== PHYSICAL REVERSIBILITY ==="
          cat results/physical_v2/tables/physical_reversibility_summary.csv
          echo "=== SOURCE STATUS ==="
          cat results/physical_v2/tables/physical_source_status.csv
          echo "=== SAMPLE COUNTS ==="
          cat results/physical_v2/tables/physical_sample_counts.csv
          echo "=== PARAMETER COVERAGE ==="
          cat results/physical_v2/tables/physical_parameter_coverage.csv
      - name: Upload physical-source v2 package
        uses: actions/upload-artifact@v4
        with:
          name: ic-causal-agents-physical-v2
          path: results/physical_v2/
          retention-days: 90
      - name: Publish physical-source v2 tagged release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ic-2026-physical-v2 >/dev/null 2>&1; then
            echo "Release ic-2026-physical-v2 already exists; leaving it unchanged."
          else
            zip -q -r ic-causal-agents-physical-v2.zip results/physical_v2/
            gh release create ic-2026-physical-v2 \
              ic-causal-agents-physical-v2.zip \
              results/physical_v2/PHYSICAL_V2_MANIFEST.json \
              results/physical_v2/PHYSICAL_V2_SUMMARY.json \
              --target "$GITHUB_SHA" \
              --title "IC 2026 — Expansão Físico-Causal v2" \
              --notes "Expansão físico-causal da IC. Dataset: ic_causal_agents_physical_v2. O baseline ic-2026-final permanece congelado. Nenhum ML/QML treinado."
          fi
      - name: Report final scientific summaries
        run: |
          echo "=== PAIRWISE IDENTIFIABILITY ==="
          cat results/final/tables/pair_summary.csv
          echo "=== TRIAD ==="
          cat results/final/tables/agent_noise_entropy_summary.csv
          echo "=== REVERSIBILITY ==="
          cat results/final/tables/reversibility_summary.csv
          echo "=== SAMPLE COUNTS ==="
          cat results/final/tables/sample_counts.csv
          echo "=== PARAMETER COVERAGE ==="
          cat results/final/tables/parameter_coverage.csv
          echo "=== FINAL FILE SIZES ==="
          du -ah results/final | sort -h | tail -40
          echo "=== ENVIRONMENT FREEZE ==="
          cat results/final/environment/requirements-freeze.txt
      - name: Persist frozen final package on finalization branch
        if: github.ref == 'refs/heads/feat/fase2-finalizacao-ic' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add -f results/final/
          if git diff --cached --quiet; then
            echo "No generated final-package changes to persist."
          else
            git commit -m "data: freeze final IC dataset and evidence [skip ci]"
            git push origin HEAD:feat/fase2-finalizacao-ic
          fi
      - name: Upload final IC evidence package
        uses: actions/upload-artifact@v4
        with:
          name: ic-causal-agents-final-v1
          path: results/final/
          retention-days: 90
      - name: Publish consolidated final IC release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ic-2026-final-v2 >/dev/null 2>&1; then
            echo "Release ic-2026-final-v2 already exists; refusing to overwrite the scientific freeze."
            exit 1
          fi
          zip -q -r ic-causal-agents-final-v1.zip results/final/
          zip -q -r ic-causal-agents-physical-v2.zip results/physical_v2/
          gh release create ic-2026-final-v2 \
            ic-causal-agents-final-v1.zip \
            ic-causal-agents-physical-v2.zip \
            results/final/FINAL_DATASET_MANIFEST.json \
            results/final/FINAL_SUMMARY.json \
            results/physical_v2/PHYSICAL_V2_MANIFEST.json \
            results/physical_v2/PHYSICAL_V2_SUMMARY.json \
            --target "$GITHUB_SHA" \
            --title "IC 2026 — Versão Final Consolidada v2" \
            --notes "Freeze computacional final da IC após integração da expansão físico-causal v2. Inclui baseline mecanístico v1 e dataset físico-causal v2. Nenhum ML/QML foi treinado."
